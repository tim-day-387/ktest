name: lustre-review
description: Lustre review — a Gerrit change's page, with its Jira ticket open; nothing is checked out
# Listed ahead of lustre-fix, which the same links and changes fill in.
default: true
variables:
  change:
    prompt: Gerrit change to review (68716)
    pattern: "[0-9]+"
    from: url
    match: "review\\.whamcloud\\.com/(?:c/.+?/\\+/|#/c/)?([0-9]+)"
  ticket:
    prompt: Jira ticket (optional)
    pattern: "LU-[0-9]+"
    optional: true
task:
  title: "Review {{change}} {{ticket}}"
  body: |
    ## Goal

    Review Gerrit change {{change}}.

    ## Notes
browser:
  profile: shared
  tabs:
    - https://review.whamcloud.com/c/fs/lustre-release/+/{{change}}
    - https://jira.whamcloud.com/browse/{{ticket}}
terminal:
  env:
    KTEST_JOB: "{{ticket}}"
  panes:
    - name: shell
