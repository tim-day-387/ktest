name: Test podman-ktest

on:
  push:
  pull_request:

jobs:
  pk-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Free disk space
      run: |
        ./ci-selftest/util_free_space.sh

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-podman podman

    - name: Start podman socket
      run: |
        systemctl --user start podman.socket

    - name: Build ktest-runner container image
      run: |
        ./pk build

    - name: Set up pk environment
      run: |
        # pk requires a kernel source directory, but `pk run` never
        # mounts it, so an empty one is enough
        mkdir -p ~/git/linux

        # environment validation only checks that a root image file
        # exists; `pk run` doesn't boot a VM
        sudo mkdir -p /var/lib/ktest
        sudo touch "/var/lib/ktest/root.$(dpkg --print-architecture)"

    - name: Enable KVM
      run: |
        sudo chmod 666 /dev/kvm

    - name: Run pk
      run: |
        ./pk run ls -l
