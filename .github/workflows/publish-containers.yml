name: Publish Container Images

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Free disk space
      run: |
        ./ci-selftest/util_free_space.sh

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-podman podman

    - name: Start podman socket
      run: |
        systemctl --user start podman.socket

    - name: Build ktest-runner container image
      run: |
        ./pk build

    - name: Log in to GitHub Container Registry
      run: |
        echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

    - name: Tag and push image
      run: |
        # Get repository owner (lowercase required for ghcr.io)
        OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

        podman tag ktest-runner:latest "ghcr.io/${OWNER}/ktest-runner:latest"
        podman tag ktest-runner:latest "ghcr.io/${OWNER}/ktest-runner:${{ github.sha }}"

        podman push "ghcr.io/${OWNER}/ktest-runner:latest"
        podman push "ghcr.io/${OWNER}/ktest-runner:${{ github.sha }}"
