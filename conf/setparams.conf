# setparams.conf - Lustre tunables for ktest VMs
#
# lctl set_param syntax, one "<param>=<value>" per line, glob wildcards
# allowed (values must not contain whitespace):
#
#   mdt.*.identity_upcall=NONE
#
# mk_initramfs installs this file as /etc/setparams.conf in the initramfs.
# mount.lustreroot applies every line after each mount step (MGS/MDT, OSTs,
# then the client), so a parameter takes effect as soon as its obd device
# exists; lines that never match any parameter file are reported once all
# mounts are done.  /init also installs the file at /etc/setparams.conf in
# the new root before switch_root, so standalone mount.lustreroot runs after
# boot apply the same tunables.
#
# Comments (#) and blank lines are ignored.

# No userspace exists yet when the MDT serves the root mount, so identity
# resolution must not call out to l_getidentity.
mdt.*.identity_upcall=NONE

# Raise the conservative metadata RPCs-in-flight default (8).
mdc.*.max_rpcs_in_flight=256

# Disable hybrid IO on the client.
llite.*.hybrid_io=0
