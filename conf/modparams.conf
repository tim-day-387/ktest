# modparams.conf - kernel module parameters for ktest VMs
#
# modprobe.d(5) "options" syntax, one directive per line:
#
#   options <module> <param>=<value> [<param>=<value> ...]
#
# The initramfs container image (containers/Containerfile.initramfs) bakes
# this file in as /etc/modprobe.d/ktest.conf, so modprobe(8) in the
# initramfs applies the parameters, and /init installs it at the same path
# in the new root before switch_root, so modules loaded later get them too.
#
# Comments (#) and blank lines are ignored.

# Panic (and halt) on SPL/ZFS assertion failures instead of hanging the VM.
options spl spl_panic_halt=1

# Let each client send more concurrent modifying metadata RPCs than the
# default (8); pairs with mdc.*.max_rpcs_in_flight in setparams.conf.
# Older Lustre trees build mdt as its own module; newer trees link the mdt
# code into the combined lustre_tgt module, which then owns the parameter.
# The line for whichever module the tree doesn't have is harmless: unknown
# module parameters only log "unknown parameter ignored".
options mdt max_mod_rpcs_per_client=256
options lustre_tgt max_mod_rpcs_per_client=256
